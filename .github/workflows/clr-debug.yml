name: Debug the frozen .NET loader (temporary)
on:
  workflow_dispatch:
  push:
    branches: [windows-startup]
    paths: [".github/workflows/clr-debug.yml"]
jobs:
  probe:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: excludes, pre: "pass", extra: "", flags: "--exclude-module tkinter --exclude-module gi --exclude-module PyQt5 --exclude-module PyQt6 --exclude-module PySide2 --exclude-module PySide6 --exclude-module qtpy --exclude-module webview.platforms.gtk --exclude-module webview.platforms.cef --exclude-module webview.platforms.android --exclude-module webview.platforms.cocoa --exclude-module webview.platforms.qt --exclude-module webview.platforms.mshtml" }
          - { name: webview-data, pre: "pass", extra: "", flags: "--collect-data webview --hidden-import webview.platforms.winforms --hidden-import webview.platforms.edgechromium" }
          - { name: winforms-import, pre: "import webview.platforms.winforms", extra: "", flags: "--hidden-import webview.platforms.winforms" }
          - { name: bleak-submodules, pre: "pass", extra: "bleak", flags: "--collect-submodules bleak" }
          - { name: everything, pre: "import webview.platforms.winforms", extra: "bleak pyusb libusb-package pillow qrcode fonttools", flags: "--collect-data webview --hidden-import webview.platforms.winforms --hidden-import webview.platforms.edgechromium --collect-submodules bleak --collect-all libusb_package --exclude-module tkinter --exclude-module gi --exclude-module PySide6 --exclude-module qtpy --exclude-module webview.platforms.qt --exclude-module webview.platforms.gtk --noupx --clean" }
    name: ${{ matrix.name }}
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install pyinstaller pywebview ${{ matrix.extra }}
      - name: Freeze a probe
        shell: pwsh
        run: |
          @'
          import sys, traceback
          out = open("probe.txt", "w")
          try:
              PRE
              out.write("pre ok\n")
              import clr
              out.write("clr ok\n")
              import System
              out.write("System ok " + str(System.Environment.Version) + "\n")
          except BaseException:
              out.write(traceback.format_exc())
          out.close()
          '@.Replace("PRE", "${{ matrix.pre }}") | Set-Content probe.py
          pyinstaller --noconfirm --windowed ${{ matrix.flags }} probe.py
          Start-Process -FilePath "dist\probe\probe.exe" -Wait
          Get-Content probe.txt
          if (-not (Select-String -Path probe.txt -Pattern "System ok" -Quiet)) { exit 1 }
