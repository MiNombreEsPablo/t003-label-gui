name: Debug the frozen .NET loader (temporary)
on:
  workflow_dispatch:
  push:
    branches: [windows-startup]
    paths: [".github/workflows/clr-debug.yml"]
jobs:
  probe:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: pillow, pre: "import PIL.Image, PIL.ImageFont, PIL.ImageDraw", extra: "pillow" }
          - { name: fonttools-qrcode, pre: "import fontTools.ttLib, qrcode", extra: "fonttools qrcode" }
          - { name: pyusb-libusb, pre: "import usb.core, libusb_package; libusb_package.get_libusb1_backend()", extra: "pyusb libusb-package", flags: "--collect-all libusb_package" }
          - { name: webview-import, pre: "import webview", extra: "" }
          - { name: bleak, pre: "import bleak", extra: "bleak" }
    name: ${{ matrix.name }}
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install pyinstaller pywebview ${{ matrix.extra }}
      - name: Freeze a probe
        shell: pwsh
        run: |
          @'
          import sys, traceback
          out = open("probe.txt", "w")
          try:
              PRE
              out.write("pre ok\n")
              import clr
              out.write("clr ok\n")
              import System
              out.write("System ok " + str(System.Environment.Version) + "\n")
          except BaseException:
              out.write(traceback.format_exc())
          out.close()
          '@.Replace("PRE", "${{ matrix.pre }}") | Set-Content probe.py
          pyinstaller --noconfirm --windowed ${{ matrix.flags }} probe.py
          Start-Process -FilePath "dist\probe\probe.exe" -Wait
          Get-Content probe.txt
          if (-not (Select-String -Path probe.txt -Pattern "System ok" -Quiet)) { exit 1 }
