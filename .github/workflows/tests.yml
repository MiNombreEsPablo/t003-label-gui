name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  QT_QPA_PLATFORM: offscreen

jobs:
  test:
    name: Python ${{ matrix.python }}, ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:  # the oldest and newest Python on Linux, and the newest on the other two systems
          - { os: ubuntu-22.04, python: "3.9" }
          - { os: ubuntu-22.04, python: "3.13" }
          - { os: windows-latest, python: "3.13" }
          - { os: macos-latest, python: "3.13" }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Libraries for headless Qt
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libxcb-cursor0
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  # The command-line tool must work with no Qt at all (Raspberry Pi, servers, BSD, old distros): install only the core
  # dependencies and check that the window tests are skipped, not failing, and that nothing quietly needed PySide6.
  without-qt:
    name: No Qt installed (Python 3.9)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"
      - run: python -m pip install -e . pytest
      - name: PySide6 really is absent
        run: python -c "import importlib.util, sys; sys.exit(importlib.util.find_spec('PySide6') is not None)"
      - run: python -m pytest -q -rs
      - name: The CLI works
        run: |
          t003-print "Hello" --qr https://example.com --preview label.png
          t003-print --version
      - name: The window explains what to install
        run: |
          if t003-gui 2> err.txt; then echo "t003-gui should fail without PySide6"; exit 1; fi
          cat err.txt
          grep -q "pip install 't003-label-gui\[gui\]'" err.txt

  # The oldest versions we claim to support, so the lower bounds in pyproject.toml are tested, not guessed.
  minimum-versions:
    name: Oldest supported libraries (Python 3.10)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Libraries for headless Qt
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libxcb-cursor0
      - run: python -m pip install --upgrade pip
      - run: python -m pip install "PySide6==6.5.3" "pillow==9.1.0" "pyusb==1.2.1" "qrcode==7.4" "fonttools==4.30.0" "libusb-package==1.0.30.0" pytest
      - run: python -m pip install -e . --no-deps
      - run: python -m pytest -q

  # What users actually get from pip: build the wheel and sdist, install the wheel (not the source tree) into a clean
  # environment, and run the self-test, which fails if a font, icon or licence is missing from the package.
  package:
    name: Wheel installs and runs
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Libraries for headless Qt
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libxcb-cursor0
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: The sdist has the data files too
        run: |
          python - <<'PY'
          import glob, tarfile
          names = tarfile.open(glob.glob("dist/*.tar.gz")[0]).getnames()
          for needle in ("assets/icon.svg", "assets/arrow-down.png", "fonts/DejaVuSans-Bold.ttf", "LICENSES/LICENSE.dejavu"):
              assert any(n.endswith(needle) for n in names), f"sdist is missing {needle}"
          PY
      - name: Install the wheel in a clean environment and self-test it
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install "$(ls dist/*.whl)[gui]"
          cd /tmp
          /tmp/clean/bin/t003-print --version
          /tmp/clean/bin/t003-gui --selftest

  # The web app runs the very same Python in the browser (Pyodide). Render a fixed set of labels in Pyodide and natively
  # and compare the dots, so the two engines can't drift apart unnoticed. Also runs the Node tests of the doodle engine
  # (the other jobs' Node is too old for them, and they skip).
  web-parity:
    name: The web engine draws what the native one does
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Pyodide, the version the site uses
        run: |
          version=$(python -c "import sys; sys.path.insert(0, 'src/t003gui/web'); import dev_server; print(dev_server.PYODIDE)")
          mkdir -p "$RUNNER_TEMP/pyodide" && cd "$RUNNER_TEMP/pyodide" && npm init -y >/dev/null && npm install "pyodide@$version"
      - run: python -m pytest -q tests/test_web_parity.py tests/test_web_js.py
        env:
          T003_PARITY_PYODIDE: ${{ runner.temp }}/pyodide
