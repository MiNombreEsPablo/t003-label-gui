name: Build the web app

# The web UI in a native window (`t003-gui --web`), packaged with PyInstaller on each OS and self-tested. Nothing is
# published from here; it proves the build works before the release workflow ships it.
on:
  pull_request:
    paths: ["packaging/**", "src/t003gui/web/**", "src/t003gui/launcher.py", "src/t003gui/selftest.py", ".github/workflows/shell.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, label: linux-x86_64, extra: "web-qt" }
          - { os: windows-latest, label: windows-x64, extra: "web" }
          - { os: macos-15, label: macos-arm64, extra: "web" }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: System libraries QtWebEngine loads at run time
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 libnss3 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libasound2 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -c packaging/build-constraints.txt -e ".[${{ matrix.extra }}]" pyinstaller
      - name: Build the app
        run: python packaging/build.py --shell
      - name: Self-test (Linux)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          du -sh dist/t003-label-studio
          echo "--- the biggest files, and folders"
          find dist/t003-label-studio -type f -printf '%s %P\n' | sort -rn | head -25 | awk '{printf "%7.1f MB  %s\n", $1/1e6, $2}'
          du -h --max-depth=3 dist/t003-label-studio | sort -rh | head -12
          dist/t003-label-studio/t003-label-studio --selftest
      - name: Self-test (macOS)
        if: runner.os == 'macOS'
        run: |
          du -sh "dist/T003 Label Studio.app"
          "dist/T003 Label Studio.app/Contents/MacOS/T003 Label Studio" --selftest
      - name: Self-test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "{0:N0} MB" -f ((Get-ChildItem "dist\T003 Label Studio" -Recurse | Measure-Object Length -Sum).Sum / 1MB)
          $env:T003_SELFTEST_LOG = "$PWD\selftest.log"
          $p = Start-Process -FilePath "dist\T003 Label Studio\T003 Label Studio.exe" -ArgumentList "--selftest" -Wait -PassThru
          if (Test-Path selftest.log) { Get-Content selftest.log }
          if ($p.ExitCode -ne 0) { throw "selftest exited with $($p.ExitCode)" }
