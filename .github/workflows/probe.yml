name: Probe (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        pyusb: ["1.2.1", "1.3.0", "1.3.1"]
        libusb: ["1.0.26.0", "1.0.26.1", "1.0.26.2", "1.0.26.3", "1.0.26.4", "1.0.30.0"]
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - run: python -m pip install "pyusb==${{ matrix.pyusb }}" "libusb-package==${{ matrix.libusb }}"
      - name: Does pyusb accept libusb-package's library?
        run: |
          python - <<'PY'
          import logging, sys
          logging.basicConfig(level=logging.DEBUG, stream=sys.stdout)
          import usb, libusb_package
          from usb.backend import libusb1
          path = libusb_package.find_library("usb-1.0")
          backend = libusb1.get_backend(find_library=libusb_package.find_library)
          print("RESULT pyusb ${{ matrix.pyusb }} + libusb-package ${{ matrix.libusb }}:", "OK" if backend else "REJECTED", path)
          sys.exit(0 if backend else 1)
          PY
