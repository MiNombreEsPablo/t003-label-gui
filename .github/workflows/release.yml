name: Build and release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, label: linux-x86_64 }   # oldest LTS runner: the AppImage then runs on newer glibc too
          - { os: windows-latest, label: windows-x64 }
          - { os: macos-latest, label: macos-arm64 }    # Apple silicon only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Libraries for headless Qt
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libxcb-cursor0

      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]" pyinstaller
      - name: Tests
        run: python -m pytest -q

      - name: Build the app
        run: python packaging/build.py

      # Each packaged app proves it is complete: fonts, licences, icons, a Japanese render and a libusb backend.
      - name: Package and self-test (Linux AppImage)
        if: runner.os == 'Linux'
        run: |
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          PATH="$PWD:$PATH" ./packaging/make_appimage.sh "${GITHUB_REF_NAME:-dev}"
          app=$(ls dist/*.AppImage)
          "$app" --appimage-extract-and-run --selftest
      - name: Package and self-test (Windows zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:T003_SELFTEST_LOG = "$PWD\selftest.log"
          $p = Start-Process -FilePath "dist\T003 Label Studio\T003 Label Studio.exe" -ArgumentList "--selftest" -Wait -PassThru
          if (Test-Path selftest.log) { Get-Content selftest.log }
          if ($p.ExitCode -ne 0) { throw "selftest exited with $($p.ExitCode)" }
          $ver = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "dev" }
          Compress-Archive -Path "dist\T003 Label Studio" -DestinationPath "dist\T003-Label-Studio-$ver-windows-x64.zip"
      - name: Package and self-test (macOS app)
        if: runner.os == 'macOS'
        run: |
          "dist/T003 Label Studio.app/Contents/MacOS/T003 Label Studio" --selftest
          ver="${GITHUB_REF_NAME:-dev}"
          ditto -c -k --keepParent "dist/T003 Label Studio.app" "dist/T003-Label-Studio-$ver-macos-arm64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: |
            dist/*.AppImage
            dist/*.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: cd artifacts && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
