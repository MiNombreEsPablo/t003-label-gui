name: Build and release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# Qt for the shipped binaries is pinned to the 6.8 LTS (packaging/build-constraints.txt): the newest PySide6 needs
# macOS 14+ and glibc 2.34+, the 6.8 wheels macOS 12+ and glibc 2.28+. pip installs are unaffected.
jobs:
  # Windows and macOS (Apple silicon and Intel). Linux is its own job below: it must build on an old base system.
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, label: windows-x64 }
          - { os: macos-15, label: macos-arm64 }
          - { os: macos-15-intel, label: macos-x86_64 }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(python -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('src/t003gui/__init__.py').read()).group(1))")
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != version v$version in src/t003gui/__init__.py"; exit 1; }

      - run: python -m pip install --upgrade pip
      - run: python -m pip install -c packaging/build-constraints.txt -e ".[dev]" pyinstaller
      - name: Tests
        run: python -m pytest -q

      - name: Build the app
        run: python packaging/build.py

      # Each packaged app proves it is complete: fonts, licences, icons, a Japanese render and a libusb backend.
      - name: Package and self-test (Windows zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:T003_SELFTEST_LOG = "$PWD\selftest.log"
          $p = Start-Process -FilePath "dist\T003 Label Studio\T003 Label Studio.exe" -ArgumentList "--selftest" -Wait -PassThru
          if (Test-Path selftest.log) { Get-Content selftest.log }
          if ($p.ExitCode -ne 0) { throw "selftest exited with $($p.ExitCode)" }
          $ver = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "dev" }
          Compress-Archive -Path "dist\T003 Label Studio" -DestinationPath "dist\T003-Label-Studio-$ver-${{ matrix.label }}.zip"
      - name: Package and self-test (macOS app)
        if: runner.os == 'macOS'
        run: |
          "dist/T003 Label Studio.app/Contents/MacOS/T003 Label Studio" --selftest
          python packaging/check_macos_min.py "dist/T003 Label Studio.app" --max 12.0
          ver="${GITHUB_REF_NAME:-dev}"
          ditto -c -k --keepParent "dist/T003 Label Studio.app" "dist/T003-Label-Studio-$ver-${{ matrix.label }}.zip"

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.label }}
          path: dist/*.zip
          if-no-files-found: error

  # Built inside AlmaLinux 8 (glibc 2.28) with a python-build-standalone Python (glibc 2.17): PyInstaller copies in the
  # build machine's libraries and libpython, so the AppImage can only run on systems at least as new as its build base.
  # (On the ubuntu-22.04 runner itself the floor was glibc 2.35.)
  build-linux:
    name: linux-x86_64
    runs-on: ubuntu-22.04
    container:
      image: almalinux:8
    steps:
      - name: System packages (Qt's runtime libraries come from this old base, so the bundle needs old glibc only)
        run: |
          dnf install -y --skip-broken --setopt=install_weak_deps=False git tar gzip xz which file binutils curl \
            ca-certificates desktop-file-utils mesa-libEGL mesa-libGL libglvnd-glx libxkbcommon libxkbcommon-x11 \
            fontconfig freetype dbus-libs glib2 libX11 libXext libXrender libXi libSM libICE libxcb \
            xcb-util-cursor xcb-util-image xcb-util-keysyms xcb-util-renderutil xcb-util-wm
      - uses: actions/checkout@v5
      - name: Python 3.12 from python-build-standalone
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/uv" python install 3.12
          "$HOME/.local/bin/uv" venv --python 3.12 /opt/venv
      - name: Tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(/opt/venv/bin/python -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('src/t003gui/__init__.py').read()).group(1))")
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != version v$version in src/t003gui/__init__.py"; exit 1; }
      - run: uv pip install --python /opt/venv/bin/python -c packaging/build-constraints.txt -e ".[dev]" pyinstaller
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: /opt/venv/bin/python -m pytest -q
      - name: Build the app
        run: /opt/venv/bin/python packaging/build.py
      - name: The build needs glibc 2.28 at most
        run: /opt/venv/bin/python packaging/check_glibc.py dist/t003-label-studio --max 2.28
      - name: Package and self-test (AppImage)
        run: |
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          PATH="$PWD:$PATH" ./packaging/make_appimage.sh "${GITHUB_REF_NAME:-dev}"
          app=$(ls dist/*.AppImage)
          "$app" --appimage-extract-and-run --selftest
      - uses: actions/upload-artifact@v6
        with:
          name: linux-x86_64
          path: dist/*.AppImage
          if-no-files-found: error

  # The AppImage on other distributions, to prove the glibc claim instead of trusting it: each image installs only the
  # system libraries the README tells users to have, then runs the self-test.
  smoke-linux:
    name: ${{ matrix.image }}
    needs: build-linux
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: "ubuntu:20.04", family: apt }
          - { image: "ubuntu:24.04", family: apt }
          - { image: "debian:11", family: apt-archive }  # end of life: its packages live on archive.debian.org
          - { image: "debian:12", family: apt }
          - { image: "almalinux:8", family: dnf }
          - { image: "almalinux:9", family: dnf }
          - { image: "fedora:latest", family: dnf }
          - { image: "archlinux:latest", family: pacman }
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: linux-x86_64
          path: app
      - name: Run the self-test on ${{ matrix.image }}
        run: |
          case "${{ matrix.family }}" in
            apt-archive) prep='sed -i -e "s|deb.debian.org|archive.debian.org|g" -e "/security.debian.org/d" -e "/-updates/d" /etc/apt/sources.list && apt-get -o Acquire::Check-Valid-Until=false update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0' ;;
            apt)    prep='apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0' ;;
            dnf)    prep='dnf install -y -q mesa-libEGL mesa-libGL libxkbcommon fontconfig dbus-libs glib2' ;;
            pacman) prep='pacman -Sy --noconfirm --quiet mesa libxkbcommon fontconfig dbus glib2' ;;
          esac
          chmod +x app/*.AppImage
          docker run --rm -v "$PWD/app:/app:ro" -e QT_QPA_PLATFORM=offscreen "${{ matrix.image }}" \
            sh -c "$prep >/dev/null && ldd --version | head -1 && /app/*.AppImage --appimage-extract-and-run --selftest"

  release:
    name: Publish release
    needs: [build, build-linux, smoke-linux]
    runs-on: ubuntu-24.04  # also runs on manual builds (to exercise the download and checksums), but only tags publish
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: cd artifacts && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
