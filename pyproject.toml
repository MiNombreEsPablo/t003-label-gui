[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "t003-label-gui"
dynamic = ["version"]
description = "Desktop GUI for printing to the ORGBRO T003 thermal label printer over raw USB (TSPL)"
requires-python = ">=3.11"
dependencies = ["PySide6", "pillow", "pyusb", "qrcode", "fonttools", "libusb-package"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
t003-gui = "t003gui.app:main"
t003-print = "t003gui.cli:main"

[tool.setuptools.dynamic]
version = {attr = "t003gui.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
t003gui = ["fonts/*.ttf", "fonts/LICENSES/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
