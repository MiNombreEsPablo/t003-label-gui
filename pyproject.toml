[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "t003-label-gui"
dynamic = ["version"]
description = "Desktop GUI for printing to the ORGBRO T003 thermal label printer over raw USB (TSPL)"
requires-python = ">=3.9"
# The core and the CLI need no Qt, so they install anywhere Python runs; the window is the optional "gui" extra.
dependencies = [
    "pillow>=9.1",
    "pyusb>=1.2.1",
    "qrcode>=7.4",
    "fonttools>=4.30",
    # Bundles libusb for Windows, macOS and Linux x86-64/arm64. Elsewhere pip would try to build it from source, which
    # fails; there the code falls back to the system libusb (apt/dnf/pkg install libusb).
    "libusb-package>=1.0.26; platform_system == 'Windows' or platform_system == 'Darwin' or (platform_system == 'Linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64' or platform_machine == 'AMD64'))",
]

[project.optional-dependencies]
gui = ["PySide6>=6.4"]  # 6.4 added QFormLayout.setRowVisible
dev = ["pytest", "PySide6>=6.4"]

[project.scripts]
t003-gui = "t003gui.launcher:main"
t003-print = "t003gui.cli:main"

[tool.setuptools.dynamic]
version = {attr = "t003gui.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
t003gui = ["fonts/*.ttf", "fonts/LICENSES/*", "assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
