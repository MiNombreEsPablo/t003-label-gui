[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "t003-label-gui"
version = "0.1.0"
description = "Desktop GUI for printing to the ORGBRO T003 thermal label printer over raw USB (TSPL)"
requires-python = ">=3.11"
dependencies = ["PySide6", "pillow", "pyusb", "qrcode"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
t003-gui = "t003gui.app:main"
t003-print = "t003gui.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
