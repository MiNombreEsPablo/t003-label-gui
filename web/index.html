<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>T003 Label Studio</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>T003 Label Studio</h1>
  <canvas id="preview" width="384" height="240" aria-label="Label preview"></canvas>

  <label for="text">Text</label>
  <textarea id="text" rows="3" placeholder="What should the label say?"></textarea>

  <div class="row">
    <div>
      <label for="font">Font</label>
      <select id="font"></select>
    </div>
    <div>
      <label for="effect">Effect</label>
      <select id="effect"></select>
    </div>
  </div>
  <div class="row checks">
    <label><input type="checkbox" id="bold" checked> Bold</label>
    <label><input type="checkbox" id="border"> Border</label>
  </div>

  <div class="row" id="printer-row" hidden>
    <div>
      <label for="mode">Printer</label>
      <select id="mode"></select>
    </div>
    <div>
      <label for="address">Bluetooth address</label>
      <input id="address" placeholder="first T003 found" hidden>
    </div>
  </div>

  <button id="print" disabled>Print</button>
  <p id="status" role="status">Loading…</p>
</main>
<noscript>This app needs JavaScript.</noscript>
<script type="module" src="main.js"></script>
</body>
</html>
