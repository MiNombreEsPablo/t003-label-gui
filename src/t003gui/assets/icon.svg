<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#dfe7f2"/>
      <stop offset="0.55" stop-color="#b9c6d8"/><stop offset="1" stop-color="#8d9db3"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e3ebf8"/></linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#aebfdc"/></linearGradient>
    <radialGradient id="orb" cx="0.4" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#bff1ff"/><stop offset="0.5" stop-color="#1ea0f0"/><stop offset="1" stop-color="#0a3fa8"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="9"/></filter>
  </defs>

  <!-- glossy orb with a soft drop shadow -->
  <ellipse cx="256" cy="450" rx="150" ry="22" fill="#06285f" opacity="0.35" filter="url(#soft)"/>
  <circle cx="256" cy="256" r="196" fill="url(#orb)" stroke="#0a3a8c" stroke-width="8"/>
  <ellipse cx="256" cy="150" rx="150" ry="92" fill="url(#gloss)"/>

  <!-- label printer -->
  <rect x="126" y="236" width="260" height="130" rx="40" fill="url(#chrome)" stroke="#27344d" stroke-width="5"/>
  <rect x="150" y="262" width="212" height="14" rx="7" fill="#27344d"/>

  <!-- sticker coming out of the slot: navy outline and soft shading for the paper, but the printed marks are strictly black (thermal) -->
  <g transform="translate(0 7)">
  <path d="M168 262 L168 178 Q168 160 186 160 L288 160 Q295 160 300 165 L339 204 Q344 209 344 216 L344 262 Z" fill="#06285f" opacity="0.35" filter="url(#soft)" transform="translate(5 8)" stroke="none" stroke-width="5" stroke-linejoin="round"/>
  <path d="M168 262 L168 178 Q168 160 186 160 L288 160 Q295 160 300 165 L339 204 Q344 209 344 216 L344 262 Z" fill="url(#paper)" stroke="#22386b" stroke-width="5" stroke-linejoin="round"/>
  <g fill="#000000"><rect x="186" y="184" width="13" height="13" rx="2"/><rect x="203" y="184" width="13" height="13" rx="2"/><rect x="237" y="184" width="13" height="13" rx="2"/><rect x="271" y="184" width="13" height="13" rx="2"/><rect x="186" y="201" width="13" height="13" rx="2"/><rect x="220" y="201" width="13" height="13" rx="2"/><rect x="254" y="201" width="13" height="13" rx="2"/><rect x="186" y="218" width="13" height="13" rx="2"/><rect x="203" y="218" width="13" height="13" rx="2"/><rect x="237" y="218" width="13" height="13" rx="2"/><rect x="271" y="218" width="13" height="13" rx="2"/></g>
  <rect x="186" y="240" width="102" height="9" rx="4.5" fill="#000000"/>
  <path d="M296 166 L296 198 Q296 208 306 208 L336 208 Q344 208 339 203 L301 165 Q296 161 296 166 Z" fill="url(#fold)" stroke="#22386b" stroke-width="5" stroke-linejoin="round"/>
  </g>

  <!-- slot lip over the sticker, LED and button -->
  <path d="M150 269 H362 Q362 276 355 276 H157 Q150 276 150 269 Z" fill="#27344d"/>
  <circle cx="170" cy="326" r="11" fill="#52e04a" stroke="#14852a" stroke-width="2"/>
  <rect x="204" y="316" width="120" height="20" rx="10" fill="#9fb0c8" stroke="#6a7c96" stroke-width="2"/>

  <!-- sparkle -->
  <path d="M404 110 l10 28 l28 10 l-28 10 l-10 28 l-10 -28 l-28 -10 l28 -10 Z" fill="#fff6a8" stroke="#ffffff" stroke-width="2"/>
</svg>
